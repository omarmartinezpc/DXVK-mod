name: Compilar DXVK 1.10.3 (noModeSwitch)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Descargar este repositorio
        uses: actions/checkout@v4

      - name: Instalar herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build glslang-tools mingw-w64 wget
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix

      - name: Descargar DXVK v1.10.3
        run: |
          wget -q https://github.com/doitsujin/dxvk/archive/refs/tags/v1.10.3.tar.gz
          tar xf v1.10.3.tar.gz

      - name: Aplicar parche
        run: |
          cd dxvk-1.10.3
          patch -p1 < ../nomodeswitch.patch

      - name: Compilar (64 bits)
        run: |
          cd dxvk-1.10.3
          meson --cross-file build-win64.txt \
                --buildtype release \
                --prefix "$GITHUB_WORKSPACE/out" \
                --strip \
                --bindir x64 \
                --libdir x64 \
                -Denable_tests=false \
                build.64
          cd build.64
          ninja install

      - name: Subir DLLs compiladas
        uses: actions/upload-artifact@v4
        with:
          name: dxvk-1.10.3-nomodeswitch-x64
          path: out/x64/*.dll
